name: Release

# Push a tag like v1.1.0 -> builds every distributable FROM THAT COMMIT, runs the
# test suite first, and publishes them with SHA256SUMS.txt. Releases can no
# longer drift from the code (the v1.0.0 binaries predated later fixes).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Test suite (gate)
        shell: powershell
        run: .\test\Run-AllTests.ps1

      - name: Real elevated collection (gate)
        shell: powershell
        run: .\test\Test-ElevatedCollection.ps1

      - name: Build distributables
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'release'
          New-Item -ItemType Directory -Force $dist | Out-Null
          dotnet publish Analyzer\src\Hawk.Analyzer\Hawk.Analyzer.csproj -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
          Copy-Item publish\hawk.exe $dist
          foreach ($preset in 'standard', 'comprehensive', 'ioc-search') {
            $pkg = Join-Path $env:RUNNER_TEMP "pkg_$preset"
            .\Collector\Builder\New-HawkCollector.ps1 -Preset $preset -OutputPath $pkg | Out-Null
            $name = if ($preset -eq 'standard') { 'HawkCollector.exe' } else { "HawkCollector-$preset.exe" }
            .\Collector\Builder\New-HawkCollectorExe.ps1 -PackageRoot $pkg -OutputExe (Join-Path $dist $name) | Out-Null
            Compress-Archive -Path "$pkg\*" -DestinationPath (Join-Path $dist "HawkCollector-$preset-package.zip")
          }
          Get-ChildItem $dist -File | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Out-File (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
          Get-Content (Join-Path $dist 'SHA256SUMS.txt')

      - name: Publish GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" (Get-ChildItem release -File).FullName `
            --title "DFIR Hawk ${{ github.ref_name }}" --generate-notes `
            --notes "Built by CI from ${{ github.sha }}. Verify downloads against SHA256SUMS.txt. Binaries are unsigned."
